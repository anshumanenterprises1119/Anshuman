<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Anshuman Enterprises</title>
<meta http-equiv="refresh" content="5;url=/">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Montserrat',sans-serif;background:#FAF7F2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#fff;border-radius:24px;padding:60px 48px;text-align:center;max-width:500px;width:100%;border:1px solid rgba(107,28,35,0.1);box-shadow:0 12px 40px rgba(61,14,20,0.08);}
.icon{font-size:64px;margin-bottom:24px;}
h1{font-family:'EB Garamond',serif;font-size:36px;color:#3D0E14;margin-bottom:12px;}
p{color:#666;font-size:15px;line-height:1.7;margin-bottom:24px;}
.home-btn{display:inline-block;background:#3D0E14;color:#C9A84C;padding:12px 32px;border-radius:50px;text-decoration:none;font-weight:700;font-size:14px;}
.timer{font-size:13px;color:#999;margin-top:12px;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Message Received!</h1>
  <p>Thank you for reaching out to <strong>Anshuman Enterprises</strong>. Our team will contact you within <strong>24 hours</strong> on the phone/email you provided.</p>
  <a href="/" class="home-btn">← Back to Home</a>
  <p class="timer">Redirecting automatically in 5 seconds…</p>
</div>
</body>
</html>
