<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Product Details — DecorateNow</title>
<meta name="theme-color" content="#111111">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" href="decoratenow_home/decoratenow_icon_logo_transparent.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <img src="decoratenow icon logo.png" alt="DecorateNow Icon" class="logo-img-icon remove-bg-yellow">
      <img src="heading logo.png" alt="DecorateNow" class="logo-img-heading remove-bg-yellow">
    </a>
    <nav class="header-actions">
      <a href="checkout.html" class="icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h2l2.2 11.2a2 2 0 002 1.6h8.6a2 2 0 002-1.6L21 7H6"/></svg>
        <span class="badge" id="cartCount">0</span>
      </a>
    </nav>
  </div>
</header>

<main class="section" style="padding-top:40px;">
  <div class="deal-banner" style="background:var(--white);color:var(--ink);border:1px solid var(--gray-line);">
    <div class="deal-media">
      <img src="https://images.unsplash.com/photo-1524484485831-a92ffc0de03f?w=900&q=80" alt="Aurelia Tiered Chandelier">
    </div>
    <div class="deal-info">
      <p class="eyebrow">Luminaire Co.</p>
      <h1 style="font-size:36px;margin-bottom:12px;">Aurelia Tiered Chandelier — Antique Brass</h1>
      <p style="color:var(--text-muted);margin-bottom:16px;">A statement centrepiece with hand-finished arms and warm-white glow.</p>
      <div class="deal-pricing" style="margin-bottom:20px;">
        <span class="deal-price" style="color:var(--gold-deep)">₹2,499</span>
        <span class="deal-mrp" style="color:var(--text-muted)">₹3,999</span>
        <span class="pc-discount">37% OFF</span>
      </div>
      <a href="checkout.html" class="btn btn-gold ripple" style="max-width:280px;">Buy Now</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>&copy; <span id="footerYear"></span> DecorateNow. All rights reserved.</p>
  </div>
</footer>

<nav class="bottom-nav">
  <a href="index.html" class="bottom-nav-item"><span>Home</span></a>
  <a href="shop.html" class="bottom-nav-item"><span>Catalog</span></a>
  <a href="checkout.html" class="bottom-nav-item"><span>Cart</span></a>
</nav>

<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
