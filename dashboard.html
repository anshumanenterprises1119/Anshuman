<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Account — DecorateNow</title>
<meta name="theme-color" content="#111111">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" href="decoratenow_home/decoratenow_icon_logo_transparent.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <img src="decoratenow icon logo.png" alt="DecorateNow Icon" class="logo-img-icon remove-bg-yellow">
      <img src="heading logo.png" alt="DecorateNow" class="logo-img-heading remove-bg-yellow">
    </a>
  </div>
</header>

<main class="section" style="padding-top:40px;max-width:900px;">
  <div class="section-head">
    <p class="eyebrow">Customer Account</p>
    <h2>Welcome Back, Member</h2>
  </div>

  <div style="display:grid;grid-template-columns:1fr;gap:20px;">
    <div style="background:var(--gray-light);padding:24px;border-radius:var(--radius-md);border:1px solid var(--gray-line);">
      <h3 style="margin-bottom:12px;font-size:22px;">Recent Orders</h3>
      <div style="padding:14px;background:var(--white);border-radius:var(--radius-sm);border:1px solid var(--gray-line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <div>
          <strong style="display:block;">Order #DN-948201</strong>
          <span style="font-size:12px;color:var(--text-muted);">Placed on July 5, 2026 • Aurelia Tiered Chandelier</span>
        </div>
        <span style="padding:4px 10px;background:rgba(47,125,79,0.15);color:var(--success);font-weight:700;font-size:12px;border-radius:999px;">Dispatched</span>
      </div>
    </div>

    <div style="background:var(--gray-light);padding:24px;border-radius:var(--radius-md);border:1px solid var(--gray-line);">
      <h3 style="margin-bottom:12px;font-size:22px;">Saved Addresses</h3>
      <p style="font-size:14px;color:var(--text-body);margin-bottom:12px;">Plot 14, Industrial Area, Greater Noida, UP 201310</p>
      <button class="btn btn-outline btn-sm">Edit Address</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>&copy; <span id="footerYear"></span> DecorateNow. All rights reserved.</p>
  </div>
</footer>

<nav class="bottom-nav">
  <a href="index.html" class="bottom-nav-item"><span>Home</span></a>
  <a href="shop.html" class="bottom-nav-item"><span>Catalog</span></a>
  <a href="dashboard.html" class="bottom-nav-item is-active"><span>Account</span></a>
</nav>

<script src="js/app.js"></script>
</body>
</html>
