<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Quote — Aditya Contractor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:#FAF7F2; color:#1c1c19; font-family:'Montserrat', sans-serif;">
${getSwitcherBar('ac', 1)}
<header style="background:#FAF7F2; border-bottom:1px solid rgba(107,28,35,0.12); padding:16px 24px;">
  <div style="max-width:1280px; margin:0 auto; display:flex; align-items:center; justify-content:space-between;">
    <a href="../index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
      <img src="../aditya-contractor-logo.png" style="height:42px; width:42px; border-radius:50%;" alt="AC Logo">
      <span style="font-family:'Cormorant Garamond', serif; font-size:22px; font-weight:700; color:#3D0E14;">Aditya Contractor</span>
    </a>
  </div>
</header>
<main style="max-width:600px; margin:60px auto; padding:40px; background:#fff; border-radius:16px; border:1px solid rgba(0,0,0,0.06);">
  <h1 style="font-family:'Cormorant Garamond', serif; font-size:36px; color:#3D0E14; margin-bottom:20px;">Request Contracting Estimate</h1>
  <form onsubmit="event.preventDefault(); alert('Request submitted! Our team will contact you shortly.');" style="display:flex; flex-direction:column; gap:16px;">
    <input type="text" placeholder="Full Name" required style="padding:12px; border-radius:8px; border:1px solid #ddd;">
    <input type="text" placeholder="Phone Number" required style="padding:12px; border-radius:8px; border:1px solid #ddd;">
    <textarea rows="4" placeholder="Briefly describe your project..." style="padding:12px; border-radius:8px; border:1px solid #ddd;"></textarea>
    <button type="submit" style="padding:12px; background:#0f172a; color:#fff; font-weight:700; border-radius:8px;">Submit Request</button>
  </form>
</main>
</body>
</html>
