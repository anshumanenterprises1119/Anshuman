<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checkout — DecorateNow</title>
<meta name="theme-color" content="#111111">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" href="decoratenow_home/decoratenow_icon_logo_transparent.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <img src="decoratenow icon logo.png" alt="DecorateNow Icon" class="logo-img-icon remove-bg-yellow">
      <img src="heading logo.png" alt="DecorateNow" class="logo-img-heading remove-bg-yellow">
    </a>
  </div>
</header>

<main class="section" style="padding-top:40px;max-width:800px;">
  <div class="section-head">
    <p class="eyebrow">Express Checkout</p>
    <h2>Shipping &amp; Delivery Address</h2>
  </div>

  <form action="payment.html" method="GET" style="display:flex;flex-direction:column;gap:16px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <input type="text" placeholder="First Name" required style="padding:14px;border:1px solid var(--gray-line);border-radius:var(--radius-md);outline:none;">
      <input type="text" placeholder="Last Name" required style="padding:14px;border:1px solid var(--gray-line);border-radius:var(--radius-md);outline:none;">
    </div>
    <input type="email" placeholder="Email Address" required style="padding:14px;border:1px solid var(--gray-line);border-radius:var(--radius-md);outline:none;">
    <input type="tel" placeholder="Phone Number" required style="padding:14px;border:1px solid var(--gray-line);border-radius:var(--radius-md);outline:none;">
    <input type="text" placeholder="Street Address, Flat / Apartment" required style="padding:14px;border:1px solid var(--gray-line);border-radius:var(--radius-md);outline:none;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <input type="text" placeholder="City" required style="padding:14px;border:1px solid var(--gray-line);border-radius:var(--radius-md);outline:none;">
      <input type="text" placeholder="Pincode" required style="padding:14px;border:1px solid var(--gray-line);border-radius:var(--radius-md);outline:none;">
    </div>
    <button type="submit" class="btn btn-gold ripple" style="margin-top:10px;">Proceed to Payment</button>
  </form>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>&copy; <span id="footerYear"></span> DecorateNow. All rights reserved.</p>
  </div>
</footer>

<nav class="bottom-nav">
  <a href="index.html" class="bottom-nav-item"><span>Home</span></a>
  <a href="shop.html" class="bottom-nav-item"><span>Catalog</span></a>
  <a href="checkout.html" class="bottom-nav-item is-active"><span>Checkout</span></a>
</nav>

<script src="js/app.js"></script>
</body>
</html>
