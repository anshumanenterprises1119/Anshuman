<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Payment — DecorateNow</title>
<meta name="theme-color" content="#111111">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" href="decoratenow_home/decoratenow_icon_logo_transparent.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<!-- Flipkart-Style Vertical Switcher Top Bar -->
<div class="ae-vertical-bar" style="background:#0f172a; padding:8px 16px; border-bottom:1px solid rgba(255,255,255,0.1); font-family:'Montserrat', sans-serif; position:sticky; top:0; z-index:10001;">
  <div style="max-width:1280px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;">
    <div style="display:flex; align-items:center; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;">
      <a href="index.html" style="display:inline-flex; align-items:center; gap:6px; padding:6px 16px; border-radius:50px; text-decoration:none; font-weight:700; font-size:12px; transition:all 0.2s; white-space:nowrap; background:#f59e0b; color:#111827; box-shadow:0 0 12px rgba(245,158,11,0.4);">
        <span>⚡</span>
        <span>Anshuman Hub</span>
      </a>
      <a href="decoratenow.html" style="display:inline-flex; align-items:center; gap:6px; padding:6px 16px; border-radius:50px; text-decoration:none; font-weight:700; font-size:12px; transition:all 0.2s; white-space:nowrap; background:rgba(255,255,255,0.08); color:#e2e8f0;">
        <span>💡</span>
        <span>DecorateNow</span>
      </a>
      <a href="services.html" style="display:inline-flex; align-items:center; gap:6px; padding:6px 16px; border-radius:50px; text-decoration:none; font-weight:700; font-size:12px; transition:all 0.2s; white-space:nowrap; background:rgba(255,255,255,0.08); color:#e2e8f0;">
        <span>🛠</span>
        <span>Aditya Contractor</span>
      </a>
      <a href="products.html" style="display:inline-flex; align-items:center; gap:6px; padding:6px 16px; border-radius:50px; text-decoration:none; font-weight:700; font-size:12px; transition:all 0.2s; white-space:nowrap; background:rgba(255,255,255,0.08); color:#e2e8f0;">
        <span>📦</span>
        <span>B2B Wholesale</span>
      </a>
    </div>
    <div style="display:flex; align-items:center; gap:16px; color:#cbd5e1; font-size:11px; font-weight:500; white-space:nowrap;">
      <span>📍 Greater Noida, UP</span>
      <span>📞 +91 70658 15743</span>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <img src="decoratenow icon logo.png" alt="DecorateNow Icon" class="logo-img-icon remove-bg-yellow">
      <img src="heading logo.png" alt="DecorateNow" class="logo-img-heading remove-bg-yellow">
    </a>
  </div>
</header>

<main class="section" style="padding-top:40px;max-width:700px;">
  <div class="section-head">
    <p class="eyebrow">Secure Gateway</p>
    <h2>Select Payment Method</h2>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <label style="padding:16px;border:1px solid var(--gold);border-radius:var(--radius-md);display:flex;align-items:center;gap:12px;background:rgba(201,168,76,0.06);cursor:pointer;">
      <input type="radio" name="payment" checked>
      <div>
        <strong style="display:block;font-size:15px;">UPI (Google Pay, PhonePe, Paytm, BHIM)</strong>
        <span style="font-size:12px;color:var(--text-muted);">Instant zero-fee transfer</span>
      </div>
    </label>

    <label style="padding:16px;border:1px solid var(--gray-line);border-radius:var(--radius-md);display:flex;align-items:center;gap:12px;cursor:pointer;">
      <input type="radio" name="payment">
      <div>
        <strong style="display:block;font-size:15px;">Credit / Debit Card</strong>
        <span style="font-size:12px;color:var(--text-muted);">Visa, Mastercard, RuPay</span>
      </div>
    </label>

    <label style="padding:16px;border:1px solid var(--gray-line);border-radius:var(--radius-md);display:flex;align-items:center;gap:12px;cursor:pointer;">
      <input type="radio" name="payment">
      <div>
        <strong style="display:block;font-size:15px;">Cash on Delivery (COD)</strong>
        <span style="font-size:12px;color:var(--text-muted);">Pay upon delivery at your doorstep</span>
      </div>
    </label>

    <a href="order-success.html" class="btn btn-gold ripple" style="margin-top:16px;text-align:center;">Complete Order (₹2,499)</a>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>&copy; <span id="footerYear"></span> DecorateNow. All rights reserved.</p>
  </div>
</footer>

<script src="js/app.js"></script>
</body>
</html>
